<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h2>🧠 Page Summarizer</h2>
    <button id="darkModeBtn">🌙</button>
  </div>

  <!-- Language Selector -->
  <div class="language-selector">
    <label>🌍 Summary Language:</label>
    <select id="languageSelect">
      <option value="English">🇬🇧 English</option>
      <option value="Tamil">🇮🇳 Tamil</option>
      <option value="Hindi">🇮🇳 Hindi</option>
      <option value="French">🇫🇷 French</option>
      <option value="Spanish">🇪🇸 Spanish</option>
      <option value="German">🇩🇪 German</option>
      <option value="Arabic">🇸🇦 Arabic</option>
      <option value="Japanese">🇯🇵 Japanese</option>
    </select>
  </div>

  <button id="summarizeBtn">Summarize This Page</button>
  <div id="loading" style="display:none">⏳ Summarizing...</div>
  <div id="summary"></div>
  <button id="copyBtn" style="display:none">📋 Copy Summary</button>
  <div id="copyMsg" style="display:none">✅ Copied!</div>
  <script src="popup.js"></script>
</body>
</html>
